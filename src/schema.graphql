type Query {
  # Users
  users: [User!]!
  user(id: ID!): User
  getUserByUsername(username: String!): User
  me: User
  """Public, rate limited (10/min). Normalizes input; errors with VALIDATION_ERROR if the format is invalid."""
  isEmailAvailable(email: String!): Boolean!
  """Public, rate limited (10/min). Case-insensitive."""
  isUsernameAvailable(username: String!): Boolean!
  players: [User!]!
  coaches: [User!]!
  umpires: [User!]!

  # Clubs & Teams
  clubs: [Club!]!
  club(id: ID!): Club
  """Super admin only."""
  clubAdmins: [ClubAdminView!]!
  teamsByClub(clubId: ID!): [Team!]!

  # Job Opportunities
  # Every list below is paginated: page >= 1 (default 1), limit 1..100 (default 50).
  # A limit above 100 or a non-integer page/limit is a 400. Newest first, ties broken by id.
  jobOpportunities(
    filters: JobOpportunityFiltersInput
    page: Int
    limit: Int
  ): [JobOpportunity!]!
  jobOpportunity(id: String!): JobOpportunity
  savedJobOpportunities(page: Int, limit: Int): [JobOpportunity!]!

  # Job Applications
  """Owning club or super admin only."""
  jobApplications(
    jobOpportunityId: String!
    status: String
    page: Int
    limit: Int
  ): [JobApplication!]!
  """Own applications or super admin only."""
  userApplications(
    userId: String!
    status: String
    page: Int
    limit: Int
  ): [JobApplication!]!
  """Applicant, owning club or super admin only."""
  jobApplication(id: String!): JobApplication
  getClubApplications(
    clubId: ID!
    status: String
    page: Int
    limit: Int
  ): [ApplicationWithUser!]!

  # Follows & Likes
  followers(entityType: FollowEntityType!, entityId: ID!): [Follow!]!
  following(entityType: FollowEntityType!, entityId: ID!): [Follow!]!
  profileLikes(entityType: LikeEntityType!, entityId: ID!): [Like!]!
  likesGiven(entityType: LikeEntityType!, entityId: ID!): [Like!]!

  # News
  news(filters: NewsFiltersInput, page: Int, limit: Int): NewsPaginatedResult!
  newsArticle(slug: String!): NewsArticle
  superAdminNewsArticles(filters: NewsFiltersInput, page: Int, limit: Int): NewsPaginatedResult!

  # Messaging
  """userId is deprecated and ignored: returns the authenticated user's conversations."""
  myConversations(userId: String): [Conversation!]!
  conversation(id: String!): Conversation
  messages(conversationId: String!): [Message!]!

  # Explore
  exploreUsers(
    role: String
    country: String
    position: String
    level: String
    licenseLevel: UmpireLicenseLevel
    modality: UmpireModality
    umpireCategory: UmpireCategory
    searchQuery: String
    search: String
    limit: Int
    offset: Int
  ): [User!]!
  exploreClubs(
    country: String
    league: String
    search: String
    limit: Int
    offset: Int
  ): [Club!]!
  availablePositions: [String!]!
  availableLeagues: [String!]!
  availableCountries: [String!]!
}

type Mutation {
  # Auth
  register(
    email: String!
    name: String!
    username: String
    password: String!
    role: String
    country: String
    city: String
    position: String
    dateOfBirth: String
    clubName: String
    managedByFirstName: String
    managedByLastName: String
  ): User!
  login(email: String!, password: String!): User!
  logout: Boolean!
  uploadAvatar(userId: ID!, base64: String!): Boolean!
    @deprecated(reason: "Use createImageUploadSignature(target: USER_AVATAR) and upload straight to Cloudinary")
  uploadCoverImage(userId: ID!, base64: String!): Boolean!
    @deprecated(reason: "Use createImageUploadSignature(target: USER_COVER) and upload straight to Cloudinary")
  uploadCV(userId: ID!, base64: String!): String!
  deleteCV(userId: ID!): Boolean!
  updateUser(
    id: ID!
    name: String
    username: String
    bio: String
    avatar: String
    coverImage: String
    coverImagePosition: String
    position: String
    country: String
    city: String
    clubId: ID
    yearsOfExperience: Int
    multimedia: [String!]
    cvUrl: String
    dateOfBirth: String
    level: UserLevel
    trajectories: [TrajectoryInput!]
    licenseLevel: UmpireLicenseLevel
    certifyingBody: String
    licenseNumber: String
    certificationYear: Int
    matchesOfficiated: Int
    travelAvailability: TravelAvailability
    languages: [String!]
    modalities: [UmpireModality!]
    umpireCategories: [UmpireCategory!]
    umpireCertifications: [UmpireCertificationInput!]
  ): User!

  # Uploads
  getS3PresignedUrl(fileName: String!, contentType: String!): S3PresignedUrl!
  """
  Signs a direct browser -> Cloudinary image upload into the caller's own
  folder. Requires a session. USER_* signs stick-transfer/users/{userId}.
  CLUB_* is only for the club itself (role CLUB) or a super admin; the super
  admin must pass clubId, which a club may omit (it must equal its own id).
  Rate limited to 20 per minute.
  """
  createImageUploadSignature(
    target: ImageUploadTarget!
    clubId: ID
  ): ImageUploadSignature!

  # Clubs
  """Creates the club profile for the authenticated user (must have role CLUB)."""
  createClub(
    name: String!
    city: String!
    country: String!
    managedByFirstName: String!
    managedByLastName: String!
    location: String
    benefits: [String!]
    instagram: String
    twitter: String
    facebook: String
    tiktok: String
  ): Club!
  """Super admin only: approves a club's verification request."""
  verifyClub(clubId: ID!): Club!
  """Super admin only: sets a club's verification status directly."""
  adminSetClubVerification(clubId: ID!, status: VerificationStatus!): Club!
  createTeam(clubId: String!, name: String!, category: String!): Team!
  """
  Club admin or super admin only. invitedBy is deprecated and ignored: the
  inviter is the authenticated user.
  """
  invitePlayerToClub(
    clubId: String!
    userId: String!
    invitedBy: String
  ): ClubMember!
  """Only the invited user can accept a pending invitation."""
  acceptMembership(membershipId: String!): ClubMember!
  updateClub(
    id: ID!
    name: String
    managedByFirstName: String
    managedByLastName: String
    description: String
    bio: String
    coverImagePosition: String
    league: String
    foundedYear: Int
    email: String
    phone: String
    website: String
    instagram: String
    twitter: String
    facebook: String
    tiktok: String
    benefits: [String!]
    videos: [String!]
    """Only urls uploaded to this club's folder, the current value, or null/"" to remove."""
    logo: String
    """Only urls uploaded to this club's folder, the current value, or null/"" to remove."""
    coverImage: String
    city: String
    country: String
  ): Club!
  requestClubVerification(clubId: ID!, documentUrl: String!): Club!
  uploadClubLogo(clubId: ID!, base64: String!): Boolean!
    @deprecated(reason: "Use createImageUploadSignature(target: CLUB_LOGO) and upload straight to Cloudinary")
  uploadClubCoverImage(clubId: ID!, base64: String!): Boolean!
    @deprecated(reason: "Use createImageUploadSignature(target: CLUB_COVER) and upload straight to Cloudinary")

  # Job Opportunities
  createJobOpportunity(
    title: String!
    description: String!
    positionType: String!
    level: String!
    country: String!
    city: String!
    salary: Float
    currency: String
    benefits: String
    gender: Gender
    expiresAt: String
    division: String
    licenseLevelRequired: UmpireLicenseLevel
    modality: UmpireModality
    umpireCategory: UmpireCategory
    matchDate: String
  ): JobOpportunity!
  updateJobOpportunity(id: String!, status: String): JobOpportunity!
  deleteJobOpportunity(id: String!): Boolean!
  saveJobOpportunity(jobOpportunityId: ID!): Boolean!
  unsaveJobOpportunity(jobOpportunityId: ID!): Boolean!

  # Job Applications
  """userId is deprecated and ignored: the applicant is the authenticated user. UMPIRE jobs accept only UMPIRE/SUPERADMIN applicants (403 otherwise)."""
  applyForJob(
    jobOpportunityId: String!
    userId: String
    coverLetter: String
    resumeUrl: String
  ): JobApplication!
  updateApplicationStatus(
    applicationId: ID!
    status: String!
    notes: String
  ): JobApplication!
  """userId is deprecated and ignored: the applicant is the authenticated user."""
  withdrawApplication(id: String!, userId: String): JobApplication!

  # Follows
  follow(
    followerType: FollowEntityType!
    followerId: ID!
    followingType: FollowEntityType!
    followingId: ID!
  ): Follow!
  unfollow(
    followerType: FollowEntityType!
    followerId: ID!
    followingType: FollowEntityType!
    followingId: ID!
  ): Boolean!

  # Likes
  likeProfile(
    likerType: LikeEntityType!
    likerId: ID!
    likedType: LikeEntityType!
    likedId: ID!
  ): Like!
  unlikeProfile(
    likerType: LikeEntityType!
    likerId: ID!
    likedType: LikeEntityType!
    likedId: ID!
  ): Boolean!

  # News (Super Admin only)
  createNewsArticle(input: NewsArticleInput!): NewsArticle!
  updateNewsArticle(id: ID!, input: NewsArticleUpdateInput!): NewsArticle!
  deleteNewsArticle(id: ID!): Boolean!
  publishNewsArticle(id: ID!): NewsArticle!
  unpublishNewsArticle(id: ID!): NewsArticle!

  # Messaging
  """The authenticated user is always added as a participant."""
  startConversation(participantIds: [String!]!): Conversation!
  """senderId is deprecated and ignored: the sender is the authenticated user."""
  sendMessage(
    conversationId: String!
    content: String!
    senderId: String
  ): Message!
  markMessageAsRead(messageId: String!): Boolean!

  # Payments
  createPaymentIntent(amount: Float!, currency: String): PaymentIntent!
}
