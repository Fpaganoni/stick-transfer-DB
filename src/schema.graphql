enum ImageUploadTarget {
  USER_AVATAR
  USER_COVER
  CLUB_LOGO
  CLUB_COVER
}

"""
Everything the browser needs to upload one image straight to Cloudinary.
Send as multipart POST to uploadUrl EXACTLY these fields: file, api_key,
timestamp, signature, public_id (= publicId below, the full path),
overwrite=true, invalidate=true and allowed_formats=jpg,png,webp. Do NOT send
folder: it is informational only and not part of the signature. Any extra or
different parameter makes Cloudinary reject the signature. Then save the
secure_url it returns via updateUser / updateClub.
"""
type ImageUploadSignature {
  cloudName: String!
  apiKey: String!
  timestamp: Int!
  signature: String!
  folder: String!
  publicId: String!
  uploadUrl: String!
}

